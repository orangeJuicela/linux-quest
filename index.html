<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Command Quest 雲端城堡</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>@font-face { font-family: 'Cubic11'; src: url('https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@main/fonts/web/Cubic_11.woff2') format('woff2'); font-display: swap; }
/* ===== Linux Command Quest — style ===== */
:root {
  --sky-lavender: #a89be8;
  --sky-lilac: #c3a6ea;
  --sky-pinklilac: #e2b0e0;
  --sky-pink: #f7bcd4;
  --sky-peach: #ffcab9;
  --sky-apricot: #ffdcae;
  --sky-cream: #ffe9c4;
  --cloud-white: #fff3f8;
  --cloud-shade1: #f3d6ec;
  --cloud-shade2: #d9d3f5;

  --panel-border: #2b2238;
  --panel-fill: #2a2546;
  --panel-inner: #352f5a;
  --panel-edge: #4b4380;
  --text-onpanel: #fff7e6;
  --text-secondary: #c9c2ef;
  --accent-yellow: #ffd447;
  --accent-yellow-shade: #e8a92a;
  --heart-red: #e8475f;
  --blush: #ff8fab;
  --pink: #ff9ebb;
  --hoodie-purple: #8a5cd6;
  --hoodie-dark: #6239a8;
  --hoodie-light: #b391f0;
  --bubble-fill: #fff7e6;
  --bubble-text: #2b2238;
  --bubble-accent: #6239a8;

  --term-bg: #0d1b14;
  --term-border: #2b2238;
  --term-inner-line: #1f8f4f;
  --term-green: #7dffa8;
  --term-prompt: #39ff88;
  --term-dim: #4fb878;
  --term-error: #ff8fab;
  --term-dir: #7fb8ff;
  --term-exec: #ffd447;
  --term-flag-bg: #3a2f00;

  --font-heading: 'Press Start 2P', 'Cubic11', monospace;
  --font-zh: 'Cubic11', 'Silkscreen', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --font-term: 'VT323', 'Cubic11', ui-monospace, 'DejaVu Sans Mono', monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: #1a1530;
  font-family: var(--font-zh);
  color: var(--text-onpanel);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

img { image-rendering: pixelated; image-rendering: crisp-edges; -ms-interpolation-mode: nearest-neighbor; }

.pixel-panel {
  background: var(--panel-fill);
  border: 3px solid var(--panel-border);
  border-radius: 0;
  box-shadow: 0 0 0 2px var(--panel-edge) inset;
}

.pixel-btn {
  font-family: var(--font-zh);
  background: var(--panel-inner);
  color: var(--text-onpanel);
  border: 3px solid var(--panel-border);
  border-radius: 0;
  box-shadow: 0 0 0 1px var(--panel-edge) inset;
  padding: 6px 10px;
  font-size: 13px;
  cursor: pointer;
}
.pixel-btn:hover { background: var(--panel-edge); }
.pixel-btn:active { transform: translateY(1px); }
.pixel-btn.primary { background: var(--hoodie-purple); border-color: var(--panel-border); color: #fff7e6; }
.pixel-btn.primary:hover { background: var(--hoodie-light); }
.pixel-btn.danger { background: var(--heart-red); color: #fff7e6; }

#app {
  position: relative;
  width: min(100vw, 177.78vh);
  height: min(100vh, 56.25vw);
  min-width: 1024px; min-height: 576px;
  display: flex; flex-direction: column;
  overflow: hidden;
}

#bg-layer {
  position: absolute; inset: 0; z-index: -1;
  background-image: var(--bg-sky-url);
  background-size: cover;
  background-position: center;
  image-rendering: pixelated;
}

/* ---------- top bar ---------- */
#top-bar {
  display: flex; align-items: center; gap: 16px;
  padding: 6px 14px;
  flex: 0 0 auto;
  z-index: 2;
}
#level-label { display: flex; align-items: center; gap: 6px; font-family: var(--font-heading); font-size: 11px; white-space: nowrap; }
.icon-crown { width: 28px; height: 20px; }
#hearts-row { display: flex; gap: 3px; }
#hearts-row img { width: 24px; height: 24px; }
#score-row { display: flex; align-items: center; gap: 4px; font-family: var(--font-heading); font-size: 11px; color: var(--accent-yellow); white-space: nowrap; }
.icon-star { width: 20px; height: 20px; }
#badges-row { display: flex; gap: 4px; flex: 1; justify-content: center; }
#badges-row img { width: 32px; height: 38px; }
#level-select-btn { margin-left: auto; white-space: nowrap; }

/* ---------- main area ---------- */
#main-area { display: flex; flex: 1 1 auto; min-height: 0; gap: 10px; padding: 0 10px; }
#left-panel { flex: 0 0 44%; display: flex; flex-direction: column; position: relative; padding: 10px; min-height: 0; overflow: hidden; }
#right-panel { flex: 1 1 56%; display: flex; min-height: 0; padding: 8px; }

.plaque {
  text-align: center; font-family: var(--font-heading); font-size: 11px;
  color: var(--accent-yellow); margin-bottom: 4px; letter-spacing: 1px;
}
.castle-wrap { display: flex; justify-content: center; align-items: flex-start; flex: 0 0 auto; }
#castle-sprite { width: 216px; height: 168px; animation: bob 2s steps(2) infinite; }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

#cages-row { display: flex; justify-content: space-between; gap: 6px; padding: 4px 4px; flex: 0 0 auto; }
.cage-slot { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 19%; position: relative; }
.cage-sprite-wrap { position: relative; width: 60px; height: 68px; display: flex; align-items: flex-end; justify-content: center; }
.cage-sprite-wrap img { position: absolute; bottom: 0; }
.cage-sprite-wrap .sprite-caged { width: 60px; height: 68px; }
.cage-sprite-wrap .sprite-open { width: 60px; height: 68px; }
.cage-sprite-wrap .sprite-happy { width: 48px; height: 52px; z-index: 1; }
.cage-name-chip {
  font-size: 9px; font-family: var(--font-heading);
  background: var(--panel-inner); color: var(--text-onpanel);
  border: 2px solid var(--panel-border);
  padding: 2px 4px; white-space: nowrap;
}
.cage-slot.is-current .cage-name-chip { background: var(--accent-yellow); color: var(--panel-border); }
.cage-slot.is-locked .cage-sprite-wrap { opacity: 0.55; filter: grayscale(0.4); }

.kitten-row { display: flex; align-items: center; gap: 10px; margin-top: auto; flex: 0 0 auto; }
.kitten-wrap { position: relative; flex: 0 0 auto; }
#kitten-sprite { width: 120px; height: 120px; }
.mug-decor { position: absolute; width: 25px; height: 17px; right: -8px; bottom: 4px; }
.speech-bubble {
  position: relative; background: var(--bubble-fill); color: var(--bubble-text);
  border: 3px solid var(--panel-border); border-radius: 0;
  padding: 8px 10px; flex: 1 1 auto; min-height: 56px;
  font-size: 13px; line-height: 1.5;
}
.bubble-tail {
  position: absolute; left: -14px; top: 20px;
  width: 0; height: 0;
  border-top: 8px solid transparent; border-bottom: 8px solid transparent;
  border-right: 14px solid var(--panel-border);
}
.bubble-tail::after {
  content: ""; position: absolute; left: 3px; top: -6px;
  width: 0; height: 0;
  border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  border-right: 11px solid var(--bubble-fill);
}
#speech-text { min-height: 36px; }
.hint-btn { position: absolute; right: 4px; bottom: 4px; font-size: 11px; padding: 3px 6px; }

#confetti-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti-piece {
  position: absolute; top: -10px; width: 6px; height: 6px;
  animation: confetti-fall 1.4s linear forwards;
}
@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(420px) rotate(180deg); opacity: 0.2; }
}

/* ---------- terminal ---------- */
.terminal-wrap {
  display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
  background: var(--term-bg); border: 3px solid var(--term-border);
  box-shadow: 0 0 0 2px var(--term-inner-line) inset;
}
.terminal-wrap.shake { animation: term-shake 0.3s linear; }
@keyframes term-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
.term-titlebar {
  flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
  background: #16281e; color: var(--term-dim); font-family: var(--font-term);
  font-size: 14px; padding: 3px 8px; border-bottom: 2px solid var(--term-border);
}
.term-status { display: flex; align-items: center; gap: 5px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--term-prompt); box-shadow: 0 0 4px var(--term-prompt); }
.term-body {
  flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0;
  padding: 8px 10px; font-family: var(--font-term); font-size: 19px; line-height: 1.3;
  color: var(--term-green);
}
#term-output { flex: 1 1 auto; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
.term-line { }
.term-line .c-dir { color: var(--term-dir); }
.term-line .c-exec { color: var(--term-exec); }
.term-line .c-err { color: var(--term-error); }
.term-line .c-dim { color: var(--term-dim); }
.term-line .c-prompt { color: var(--term-prompt); font-weight: bold; }
.term-line .c-flag { color: var(--term-exec); background: var(--term-flag-bg); padding: 0 2px; }
.term-inputline { display: flex; align-items: center; flex: 0 0 auto; margin-top: 2px; }
.term-inputline .prompt { color: var(--term-prompt); font-weight: bold; margin-right: 6px; white-space: nowrap; }
#term-input {
  flex: 1 1 auto; background: transparent; border: none; outline: none;
  color: var(--term-green); font-family: var(--font-term); font-size: 19px; caret-color: var(--term-prompt);
}

/* ---------- bottom bar ---------- */
#bottom-bar { display: flex; align-items: center; gap: 14px; padding: 6px 14px; flex: 0 0 auto; z-index: 2; }
#chip-row { display: flex; gap: 5px; flex-wrap: wrap; flex: 1 1 auto; }
.cmd-chip {
  font-family: var(--font-term); font-size: 15px; background: var(--panel-inner);
  color: var(--term-exec); border: 2px solid var(--panel-border); padding: 2px 7px; cursor: pointer;
}
.cmd-chip:hover { background: var(--panel-edge); }
#objective-row { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--accent-yellow); white-space: nowrap; flex: 0 0 auto; max-width: 44%; }
#objective-row .icon-star { width: 16px; height: 16px; }
#objective-text { white-space: normal; }

/* ---------- modals ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(10, 6, 20, 0.72);
  display: flex; align-items: center; justify-content: center; z-index: 50;
}
.modal-overlay[hidden] { display: none; }
.modal-box {
  background: var(--panel-fill); padding: 22px 26px; max-width: 640px; width: 90%;
  max-height: 85vh; overflow-y: auto;
}
.modal-box.wide { max-width: 760px; }
.modal-box h2 { font-family: var(--font-heading); font-size: 16px; color: var(--accent-yellow); margin: 0 0 14px; }
.modal-box h3 { font-size: 14px; color: var(--hoodie-light); margin: 0 0 4px; }
.modal-text { font-size: 14px; line-height: 1.7; white-space: pre-line; }
.modal-objective { font-size: 13px; color: var(--accent-yellow); margin-top: 10px; }
.postclear-section { margin-bottom: 12px; font-size: 13px; line-height: 1.6; }
.modal-box .pixel-btn { margin-top: 10px; }

#levelselect-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.ls-item {
  display: flex; align-items: center; gap: 10px; padding: 8px;
  border: 2px solid var(--panel-border); background: var(--panel-inner); cursor: pointer;
}
.ls-item.locked { opacity: 0.5; cursor: not-allowed; }
.ls-item img { width: 36px; height: 41px; }
.ls-item .ls-name { font-size: 13px; flex: 1; }
.ls-item .ls-status { font-size: 12px; color: var(--accent-yellow); }
.levelselect-footer { display: flex; justify-content: space-between; margin-top: 8px; }

#ending-servers { display: flex; justify-content: center; gap: 14px; margin: 14px 0; }
#ending-servers img { width: 56px; height: 60px; animation: dance 0.6s steps(2) infinite alternate; }
#ending-servers img:nth-child(2n) { animation-delay: 0.15s; }
@keyframes dance { 0% { transform: translateY(0) rotate(-3deg); } 100% { transform: translateY(-8px) rotate(3deg); } }
#ending-badges { display: flex; justify-content: center; gap: 8px; margin: 10px 0; }
#ending-badges img { width: 34px; height: 41px; }

/* level-clear sprite animations */
.cage-sprite-wrap.anim-shake { animation: cage-shake 0.4s linear 2; }
@keyframes cage-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px);} 75% { transform: translateX(3px);} }
.cage-sprite-wrap .sprite-happy.anim-hop { animation: srv-hop 0.5s steps(2) 2; }
@keyframes srv-hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

.clear-banner {
  position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
  background: var(--accent-yellow); color: var(--panel-border);
  font-family: var(--font-heading); font-size: 20px; padding: 16px 26px;
  border: 4px solid var(--panel-border); z-index: 60; text-align: center; line-height: 1.8;
  box-shadow: 0 0 0 4px var(--accent-yellow-shade);
}

@media (prefers-reduced-motion: reduce) {
  #castle-sprite, .cage-sprite-wrap.anim-shake, .sprite-happy.anim-hop, .confetti-piece,
  #ending-servers img, .terminal-wrap.shake { animation: none !important; }
}

/* ===================================================================
   Art-direction pass (concept match): sky scene, bigger sprites,
   plaque, cages on cloud, desk + kitten, chunkier chips
   =================================================================== */
html, body { background: #a89be8 var(--bg-sky-url) center / cover no-repeat; image-rendering: pixelated; }
#bg-layer { z-index: 0; }
#top-bar, #main-area, #bottom-bar { position: relative; z-index: 1; }
#top-bar { margin: 8px 10px 8px; box-shadow: 0 0 0 2px var(--panel-edge) inset, 4px 4px 0 rgba(43,34,56,.35); }
#bottom-bar { margin: 8px 10px; box-shadow: 0 0 0 2px var(--panel-edge) inset, 4px 4px 0 rgba(43,34,56,.35); }
#level-label, #score-row { background: var(--panel-inner); border: 3px solid var(--panel-border); padding: 5px 10px; }
#level-label { font-size: 12px; }
#score-row { font-size: 13px; }
#hearts-row img { width: 28px; height: 28px; }
#badges-row img { width: 40px; height: 48px; }

/* left panel = open sky scene, no dark box */
#left-panel {
  background: transparent; border: none; box-shadow: none; padding: 4px 6px 0;
}
.plaque {
  align-self: center; background: #fff7e6; color: var(--panel-border);
  border: 3px solid var(--panel-border); box-shadow: 0 0 0 2px #e2b0e0 inset, 3px 3px 0 rgba(43,34,56,.35);
  padding: 7px 14px; font-size: 13px; margin: 2px 0 2px; color: #6239a8;
}
#castle-sprite { width: 288px; height: 224px; filter: drop-shadow(0 6px 0 rgba(108,95,199,.25)); }
#cages-row { margin-top: -34px; padding: 0 8px; justify-content: center; gap: 10px; position: relative; z-index: 2; }
.cage-slot { width: auto; flex: 0 0 auto; }
.cage-sprite-wrap, .cage-sprite-wrap .sprite-caged, .cage-sprite-wrap .sprite-open { width: 90px; height: 102px; }
.cage-sprite-wrap .sprite-happy { width: 72px; height: 78px; bottom: 6px; }
.cage-name-chip { font-size: 10px; background: var(--panel-fill); color: #fff7e6; border: 3px solid var(--panel-border); padding: 4px 6px; margin-top: -4px; }
.cage-slot.is-current .cage-name-chip { background: var(--accent-yellow); color: var(--panel-border); }
.cage-slot.is-locked .cage-sprite-wrap { opacity: 1; filter: none; }

/* kitten at a little desk, bubble to the right */
.kitten-row { align-items: flex-end; gap: 14px; padding: 0 4px 0; position: relative; }
.kitten-row::after { /* desk */
  content: ""; position: absolute; left: -6px; bottom: 0; width: 190px; height: 16px;
  background: #8b5e3c; border: 3px solid var(--panel-border); box-shadow: 0 -4px 0 #b07a4f inset;
}
.kitten-wrap { z-index: 1; margin-bottom: 10px; }
#kitten-sprite { width: 160px; height: 160px; display: block; }
.mug-decor { width: 40px; height: 28px; right: -22px; bottom: 2px; }
.speech-bubble {
  align-self: center; margin-bottom: 28px; font-size: 15px; line-height: 1.55; padding: 10px 12px 34px;
  box-shadow: 0 0 0 2px #f3d6ec inset, 4px 4px 0 rgba(43,34,56,.35); min-height: 78px;
}
.bubble-tail { top: auto; bottom: 18px; }
#speech-text { min-height: 40px; }
#speech-text:empty::before { content: "喵～點我旁邊的 💡 或打 hint 可以拿提示喔！"; opacity: .55; }

/* terminal panel: dark frame like the concept */
#right-panel { background: var(--panel-fill); }
.term-titlebar { font-size: 16px; color: #c9f5d8; }
.term-body { font-size: 20px; }
#term-input { font-size: 20px; }

/* bottom bar: chunkier command chips */
#bottom-bar::before { content: "你會的指令"; font-family: var(--font-zh); font-size: 13px; color: var(--accent-yellow); white-space: nowrap; }
.cmd-chip {
  font-size: 18px; min-width: 52px; padding: 6px 10px; color: #fff7e6;
  border: 3px solid var(--panel-border); box-shadow: 0 0 0 2px var(--panel-edge) inset, 0 3px 0 #1a1530;
}
.cmd-chip:active { transform: translateY(2px); box-shadow: 0 0 0 2px var(--panel-edge) inset; }
#objective-row {
  background: var(--panel-inner); border: 3px solid var(--panel-border); padding: 6px 10px; font-size: 14px; color: #fff7e6;
}
#objective-row .icon-star { width: 22px; height: 22px; }

/* level-clear extras */
.clear-banner { white-space: pre-line; animation: banner-pop .35s steps(3) both; }
@keyframes banner-pop { 0% { transform: translate(-50%,-50%) scale(.4); } 100% { transform: translate(-50%,-50%) scale(1); } }
.padlock-pop { position: fixed; width: 24px; height: 30px; z-index: 40; pointer-events: none; animation: lock-pop .9s steps(6) forwards; }
@keyframes lock-pop { 0% { transform: translate(0,0) rotate(0); opacity: 1; } 40% { transform: translate(18px,-46px) rotate(30deg); } 100% { transform: translate(40px,30px) rotate(90deg); opacity: 0; } }
.confetti-piece { width: 8px; height: 8px; box-shadow: 0 0 0 2px rgba(43,34,56,.25); }

/* small screens (e.g. 1024x576 / short viewports) */
@media (max-height: 700px) {
  #castle-sprite { width: 216px; height: 168px; }
  #cages-row { margin-top: -26px; }
  .cage-sprite-wrap, .cage-sprite-wrap .sprite-caged, .cage-sprite-wrap .sprite-open { width: 60px; height: 68px; }
  .cage-sprite-wrap .sprite-happy { width: 48px; height: 52px; bottom: 4px; }
  #kitten-sprite { width: 120px; height: 120px; }
  .kitten-row::after { width: 150px; }
  .speech-bubble { font-size: 13px; min-height: 60px; }
  .cmd-chip { font-size: 16px; padding: 3px 8px; min-width: 40px; }
}
@media (min-height: 900px) {
  #castle-sprite { width: 360px; height: 280px; }
  #cages-row { margin-top: -64px; }
  .cage-sprite-wrap, .cage-sprite-wrap .sprite-caged, .cage-sprite-wrap .sprite-open { width: 120px; height: 136px; }
  .cage-sprite-wrap .sprite-happy { width: 96px; height: 104px; bottom: 8px; }
  #kitten-sprite { width: 200px; height: 200px; }
  .kitten-row::after { width: 230px; }
}
@media (prefers-reduced-motion: reduce) { .padlock-pop, .clear-banner { animation: none !important; } }
/* keep the bottom bar one row even when many commands are known */
#chip-row { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: #6c5fc7 transparent; padding-bottom: 3px; min-width: 0; }
.cmd-chip { flex: 0 0 auto; white-space: nowrap; font-size: 16px; padding: 4px 8px; min-width: 0; }
#objective-row { max-width: 40%; }
</style>
</head>
<body>
<div id="app">
  <div id="bg-layer"></div>

  <div id="top-bar" class="pixel-panel">
    <div id="level-label"><img class="icon-crown" alt=""><span id="level-label-text">LEVEL 1 / 城堡大門</span></div>
    <div id="hearts-row" aria-label="生命值"></div>
    <div id="score-row"><img class="icon-star" alt=""><span id="score-text">0 / 750</span></div>
    <div id="badges-row" aria-label="徽章"></div>
    <button id="level-select-btn" class="pixel-btn">≡ 關卡</button>
  </div>

  <div id="main-area">
    <div id="left-panel" class="pixel-panel">
      <div class="plaque">◆ CLOUD CASTLE ◆</div>
      <div class="castle-wrap"><img id="castle-sprite" alt="castle"></div>
      <div id="cages-row"></div>
      <div class="kitten-row">
        <div class="kitten-wrap">
          <img id="kitten-sprite" alt="kitten">
          <img id="mug-sprite" class="mug-decor" alt="">
        </div>
        <div class="speech-bubble">
          <div class="bubble-tail"></div>
          <div id="speech-text"></div>
          <button id="hint-btn" class="pixel-btn hint-btn" title="提示">💡 提示</button>
        </div>
      </div>
      <div id="confetti-layer"></div>
    </div>

    <div id="right-panel" class="pixel-panel">
      <div class="terminal-wrap" id="terminal-wrap">
        <div class="term-titlebar">
          <span>terminal v1.0.0</span>
          <span class="term-status"><span class="status-dot"></span>connected</span>
        </div>

<script>/* ===== Linux Command Quest — virtual filesystem + shell engine ===== */
/* Pure JS, in-memory fake FS. No real system access. */
var LCQ = window.LCQ || {};
(function (LCQ) {
  "use strict";

  /* ---------- VFS node helpers ---------- */
  function dir(name, perm, children) {
    return { type: "dir", name: name, perm: perm || "rwxr-xr-x", owner: "player", children: children || {} };
  }
  function file(name, content, opts) {
    opts = opts || {};
    return {
      type: "file",
      name: name,
      perm: opts.perm || "rw-r--r--",
      owner: opts.owner || "player",
      content: content == null ? "" : content,
      suid: !!opts.suid,
      isScript: !!opts.isScript,
      scriptOutput: opts.scriptOutput || null
    };
  }

  function splitPath(p) {
    return p.split("/").filter(function (s) { return s.length > 0; });
  }

  /* VFS: root tree + cwd stack, HOME = /home/player */
  function VFS(root) {
    this.root = root;
    this.home = "/home/player";
    this.cwd = this.home;
    this.prevCwd = this.home;
  }

  VFS.prototype.resolve = function (p) {
    // returns absolute path string (not resolved to node)
    if (!p || p === "") return this.cwd;
    if (p === "~") return this.home;
    if (p.indexOf("~/") === 0) p = this.home + "/" + p.slice(2);
    var base = p[0] === "/" ? "" : this.cwd;
    var parts = splitPath(base + "/" + p);
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (part === ".") continue;
      if (part === "..") { out.pop(); continue; }
      out.push(part);
    }
    return "/" + out.join("/");
  };

  VFS.prototype.getNode = function (absPath) {
    if (absPath === "/") return this.root;
    var parts = splitPath(absPath);
    var node = this.root;
    for (var i = 0; i < parts.length; i++) {
      if (!node || node.type !== "dir" || !node.children[parts[i]]) return null;
      node = node.children[parts[i]];
    }
    return node;
  };

  VFS.prototype.getParent = function (absPath) {
    var parts = splitPath(absPath);
    var name = parts.pop();
    var parentPath = "/" + parts.join("/");
    return { parent: this.getNode(parentPath), name: name, parentPath: parentPath };
  };

  VFS.prototype.displayCwd = function () {
    if (this.cwd === this.home) return "~";
    if (this.cwd.indexOf(this.home + "/") === 0) return "~" + this.cwd.slice(this.home.length);
    return this.cwd;
  };

  function canRead(node) { return !node || node.perm.indexOf("r") !== -1 || node.perm[0] === "r"; }
  function isReadable(node) { if (!node) return false; return node.perm[0] === "r"; }
  function isWritable(node) { if (!node) return false; return node.perm[1] === "w"; }
  function isExecutable(node) { if (!node) return false; return node.perm[2] === "x"; }

  LCQ.vfsUtil = { dir: dir, file: file, splitPath: splitPath, isReadable: isReadable, isWritable: isWritable, isExecutable: isExecutable };
  LCQ.VFS = VFS;

  /* ---------- Levenshtein distance ---------- */
  function levenshtein(a, b) {
    var m = a.length, n = b.length;
    var dp = [];
    for (var i = 0; i <= m; i++) dp.push([i].concat(new Array(n).fill(0)));
    for (var j = 0; j <= n; j++) dp[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
      }
    }
    return dp[m][n];
  }
  LCQ.levenshtein = levenshtein;

  /* ---------- Tokenizer ---------- */
  function tokenize(input) {
    var tokens = [];
    var i = 0, n = input.length;
    while (i < n) {
      while (i < n && /\s/.test(input[i])) i++;
      if (i >= n) break;
      if (input[i] === "|") { tokens.push({ type: "pipe" }); i++; continue; }
      if (input[i] === ">") {
        if (input[i + 1] === ">") { tokens.push({ type: "appendredir" }); i += 2; }
        else { tokens.push({ type: "redir" }); i += 1; }
        continue;
      }
      var buf = "";
      while (i < n) {
        var c = input[i];

      stages[stages.length - 1].push(tokens[i]);

    var i = 0;

      }

      }
      i++;

    return { argv: argv, redirect: redirect };
  }

    return splitStages(tokenize(line)).map(parseStage);
  };

  /* ---------- flag parsing helpers for ls/find/etc ---------- */
  function parseFlags(args, known) {
    // known: set of single-letter flags allowed, e.g. "lar"
    var flags = {};
    var rest = [];
    args.forEach(function (a) {
      if (a.length > 1 && a[0] === "-" && a[1] !== "-" && !/^-\d/.test(a)) {
        for (var i = 1; i < a.length; i++) {
          if (known.indexOf(a[i]) !== -1) flags[a[i]] = true;
        }
      } else {
        rest.push(a);
      }
    });
    return { flags: flags, rest: rest };
  }

  /* ---------- permission formatting ---------- */
  function fullPermString(node) {
    var t = node.type === "dir" ? "d" : "-";
    var p = node.perm;
    if (node.suid) p = p.slice(0, 2) + (p[2] === "x" ? "s" : "S") + p.slice(3);
    return t + p;
  }
  LCQ.fullPermString = fullPermString;

  function octalDigitToRWX(d) {
    d = parseInt(d, 10);
    return (d & 4 ? "r" : "-") + (d & 2 ? "w" : "-") + (d & 1 ? "x" : "-");
  }

  function applyChmod(node, spec) {
    if (/^[0-7]{3,4}$/.test(spec)) {
      var digits = spec.length === 4 ? spec.slice(1) : spec;
      var suidDigit = spec.length === 4 ? parseInt(spec[0], 10) : 0;
      node.perm = octalDigitToRWX(digits[0]) + octalDigitToRWX(digits[1]) + octalDigitToRWX(digits[2]);
      node.suid = !!(suidDigit & 4);
      return true;
    }
    // symbolic: comma separated clauses like u+x,g-w,a=r
    var clauses = spec.split(",");
    var ok = false;
    clauses.forEach(function (clause) {
      var m = clause.match(/^([ugoa]*)([+\-=])([rwx]*)$/);
      if (!m) return;
      ok = true;
      var who = m[1] || "a";
      var op = m[2];
      var what = m[3];
      var whoSet = who === "a" ? ["u", "g", "o"] : who.split("");
      var perm = node.perm.split("");
      whoSet.forEach(function (w) {
        var base = w === "u" ? 0 : w === "g" ? 3 : 6;
        ["r", "w", "x"].forEach(function (letter, idx) {
          var has = what.indexOf(letter) !== -1;
          if (op === "+" && has) perm[base + idx] = letter;

        kittenLine: "喵～你看，這個 /usr/bin/sudo 檔案上有 SUID 標記，意味著執行時會暫時變成 root 權限……下一季：提權篇，敬請期待！"
      }
    }
  ];

  LCQ.L5_TOP_IP = L5_TOP_IP;

})(LCQ);
window.LCQ = LCQ;
</script>
<script>/* ===== Linux Command Quest — app bootstrap, UI, state ===== */
(function () {
  "use strict";

  var STORAGE_KEY = "lcq_progress_v1";
  var SCORE_MAX = 750;
  var CAGE_LABELS = { web: "WEB", log: "LOG", file: "FILE", db: "DB", root: "ROOT" };
  var TEASE_LINES = [
    "喵！再試試看～", "唔…不是這個喔，再找找！", "喵嗚，差一點點，別放棄！", "再仔細看看線索吧，喵～"
  ];

  var PROGRESS = null;
  var GAME = {
    levelIndex: 0, vfs: null, history: [], historyIndex: 0,
    hearts: 3, hintTier: 0, hintsUsedThisLevel: 0, hintPenalty: 0, wrongFlagPenalty: 0,
    startTime: 0, gameCtx: null, reducedMotion: false
  };

  var MODALS = {
    "story-modal": { continueBtn: "story-continue-btn" },
    "postclear-modal": { continueBtn: "postclear-continue-btn" },
    "levelselect-modal": { continueBtn: "levelselect-close-btn" },
    "ending-modal": { continueBtn: "ending-close-btn" }
  };

  var input, termOutput, promptEl, terminalWrap;

  /* ---------- small DOM helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function span(text, cls) {
    var s = document.createElement("span");
    if (cls) s.className = cls;
    s.textContent = text;
    return s;
  }
  function makeIcon(name, cls) {
    var img = document.createElement("img");
    img.src = SPRITES[name];
    if (cls) img.className = cls;
    img.alt = "";
    return img;
  }
  function showModal(id) { $(id).hidden = false; }
  function hideModal(id) { $(id).hidden = true; }

  /* ---------- persistence ---------- */
  function defaultProgress() {
    return {
      version: 1, currentLevel: 1,
      cleared: [false, false, false, false, false],
      score: 0,
      hintsUsed: [0, 0, 0, 0, 0],
      bestTimes: [null, null, null, null, null],
      badges: [false, false, false, false, false]
    };
  }
  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultProgress();
      var parsed = JSON.parse(raw);
      var p = defaultProgress();
      for (var k in p) if (parsed[k] !== undefined) p[k] = parsed[k];
      return p;
    } catch (e) { return defaultProgress(); }
  }
  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS)); } catch (e) { /* ignore */ }
  }
  function resetProgress() {
    PROGRESS = defaultProgress();
    saveProgress();
  }

  /* ---------- terminal text rendering (no innerHTML with content ever) ---------- */
  var FLAG_RE = /flag\{[^}]*\}/g;
  function appendFlagAware(container, text, extraCls) {
    FLAG_RE.lastIndex = 0;
    var last = 0, m;
    var any = false;
    while ((m = FLAG_RE.exec(text))) {
      any = true;
      if (m.index > last) container.appendChild(span(text.slice(last, m.index), extraCls));
      container.appendChild(span(m[0], "c-flag"));
      last = m.index + m[0].length;
    }
    if (!any) { container.appendChild(span(text, extraCls)); return; }
    if (last < text.length) container.appendChild(span(text.slice(last), extraCls));
  }

  function renderOutItem(item) {
    var line = document.createElement("div");
    line.className = "term-line";
    if (typeof item === "string") {
      appendFlagAware(line, item, "");
    } else if (item.row) {
      item.row.forEach(function (r, i) {
        line.appendChild(span(r.name, r.cls));
        if (i < item.row.length - 1) line.appendChild(document.createTextNode("  "));
      });
    } else if (item.pre != null) {
      line.appendChild(span(item.pre, "c-dim"));
      line.appendChild(span(item.name, item.cls));
    } else if (item.prefix != null) {
      if (item.prefix) line.appendChild(span(item.prefix, "c-dim"));
      appendFlagAware(line, item.text, "");
    }
    return line;
  }

  function printLine(el) { termOutput.appendChild(el); scrollBottom(); }
  function printText(text, cls) {
    var line = document.createElement("div");
    line.className = "term-line";
    appendFlagAware(line, text, cls || "");
    printLine(line);
  }
  function scrollBottom() { termOutput.scrollTop = termOutput.scrollHeight; }
  function clearTerminal() { termOutput.textContent = ""; }

  function promptString() { return "player@cloud-castle:" + GAME.vfs.displayCwd() + "$"; }
  function commandEchoLine(cmdText) {
    var line = document.createElement("div");
    line.className = "term-line";
    line.appendChild(span(promptString() + " ", "c-prompt"));
    line.appendChild(span(cmdText, ""));
    return line;
  }

  /* ---------- kitten speech bubble ---------- */
  var typewriterTimer = null, talkToggleTimer = null, talkFrame = "idle";
  function setKittenSprite(name) { $("kitten-sprite").src = SPRITES["kitten_" + name]; }
  function kittenSay(text, opts) {
    opts = opts || {};
    if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }
    if (talkToggleTimer) { clearInterval(talkToggleTimer); talkToggleTimer = null; }
    var el = $("speech-text");
    el.textContent = "";
    if (GAME.reducedMotion) {
      el.textContent = text;
      setKittenSprite(opts.happy ? "happy" : "idle");
      if (opts.onDone) opts.onDone();
      return;
    }
    talkFrame = "talk"; setKittenSprite("talk");
    talkToggleTimer = setInterval(function () {
      talkFrame = talkFrame === "idle" ? "talk" : "idle";
      setKittenSprite(talkFrame);
    }, 180);
    var i = 0;
    function step() {
      if (i < text.length) {
        el.textContent += text[i]; i++;
        typewriterTimer = setTimeout(step, 25);
      } else {
        clearInterval(talkToggleTimer); talkToggleTimer = null;
        setKittenSprite(opts.happy ? "happy" : "idle");
        if (opts.onDone) opts.onDone();
      }
    }
    step();
  }

  /* ---------- top/bottom bar rendering ---------- */
  function currentLevel() { return LCQ.LEVELS[GAME.levelIndex]; }

  function renderLevelLabel() {
    $("level-label-text").textContent = "LEVEL " + (GAME.levelIndex + 1) + " / " + currentLevel().nameZh;
  }
  function renderHearts() {
    var row = $("hearts-row"); row.textContent = "";
    for (var i = 0; i < 3; i++) row.appendChild(makeIcon(i < GAME.hearts ? "heart_full" : "heart_empty"));
  }
  function renderScore() {
    $("score-text").textContent = Math.max(0, PROGRESS.score) + " / " + SCORE_MAX;
  }
  function renderBadgesRow() {
    var row = $("badges-row"); row.textContent = "";
    LCQ.LEVELS.forEach(function (lvl, i) {
      row.appendChild(makeIcon(PROGRESS.badges[i] ? "badge_" + lvl.badge : "badge_locked"));
    });
  }
  function renderObjective() {
    $("objective-text").textContent = "目標：" + currentLevel().objective;
  }
  function renderChips() {
    var container = $("chip-row"); container.textContent = "";
    var cmds = [];
    for (var i = 0; i <= GAME.levelIndex; i++) {
      LCQ.LEVELS[i].commandsLearned.forEach(function (c) { if (cmds.indexOf(c) === -1) cmds.push(c); });
    }
    ["help", "hint", "submit"].forEach(function (c) { if (cmds.indexOf(c) === -1) cmds.push(c); });
    cmds.forEach(function (c) {
      var chip = document.createElement("button");
      chip.type = "button"; chip.className = "cmd-chip"; chip.textContent = c;
      chip.addEventListener("click", function () { onChipClick(c); });
      container.appendChild(chip);
    });
  }
  function onChipClick(text) {
    if (input.disabled) return;
    var v = input.value;
    if (v && !/\s$/.test(v)) v += " ";
    input.value = v + text + " ";
    input.focus();
  }

  function renderCagesRow() {
    var container = $("cages-row"); container.textContent = "";
    LCQ.LEVELS.forEach(function (lvl, i) {
      var slot = document.createElement("div");
      slot.className = "cage-slot";
      if (i === GAME.levelIndex) slot.classList.add("is-current");
      var unlocked = i <= (PROGRESS.currentLevel - 1) || PROGRESS.cleared[i];
      if (!unlocked) slot.classList.add("is-locked");
      var wrap = document.createElement("div");
      wrap.className = "cage-sprite-wrap"; wrap.id = "cage-wrap-" + i;
      if (PROGRESS.cleared[i]) {
        wrap.appendChild(makeIcon("cage_open", "sprite-open"));
        wrap.appendChild(makeIcon("srv_" + lvl.key + "_happy", "sprite-happy"));
      } else {
        wrap.appendChild(makeIcon("srv_" + lvl.key + "_caged", "sprite-caged"));
      }
      slot.appendChild(wrap);
      var chip = document.createElement("div");
      chip.className = "cage-name-chip"; chip.textContent = CAGE_LABELS[lvl.key];
      slot.appendChild(chip);
      container.appendChild(slot);
    });
  }

  function updatePrompt() { promptEl.textContent = promptString(); }

  /* ---------- unknown command handling ---------- */
  var ALL_CMD_NAMES = LCQ.COMMAND_NAMES.concat(["clear", "bash"]);
  function closestCommand(cmd) {
    var best = null, bestDist = Infinity;
    ALL_CMD_NAMES.forEach(function (name) {
      var d = LCQ.levenshtein(cmd, name);
      if (d < bestDist) { bestDist = d; best = name; }
    });
    return bestDist <= 2 ? best : null;
  }
  function handleUnknown(cmd) {
    printText("bash: " + cmd + ": command not found", "c-err");
    var suggestion = closestCommand(cmd);
    var msg = suggestion
      ? ("喵？" + cmd + " 是什麼呀？你是想打 " + suggestion + " 吧 🐾")
      : ("喵？我看不懂「" + cmd + "」耶…輸入 help 看看有哪些指令吧！");
    kittenSay(msg);
  }

  /* ---------- hint ---------- */
  function showHint() {
    var lvl = currentLevel();
    var tierIdx = Math.min(GAME.hintTier, lvl.hints.length - 1);
    var isNewReveal = GAME.hintTier < lvl.hints.length;
    kittenSay(lvl.hints[tierIdx]);
    if (isNewReveal) {
      if (GAME.hintTier > 0) {
        GAME.hintPenalty += 20;
        PROGRESS.score -= 20;
        renderScore();
      }
      GAME.hintsUsedThisLevel++;
      GAME.hintTier++;
    }
  }

  /* ---------- submit / wrong flag / clear sequence ---------- */
  function shakeTerminal() {
    terminalWrap.classList.add("shake");
    setTimeout(function () { terminalWrap.classList.remove("shake"); }, 320);
  }
  function loseHeart() {
    GAME.hearts--; renderHearts();
    shakeTerminal();
    kittenSay(TEASE_LINES[Math.floor(Math.random() * TEASE_LINES.length)]);
    if (GAME.hearts <= 0) {
      input.disabled = true;
      setTimeout(restartLevelGently, GAME.reducedMotion ? 150 : 900);
    }
  }
  function restartLevelGently() {
    loadLevel(GAME.levelIndex, { silent: true });
    printText("—— 這一關重新開始囉 ——", "c-dim");
    kittenSay("別灰心，喵哥陪你重新來過！");
  }
  function handleSubmit(arg) {
    var lvl = currentLevel();
    var candidate = (arg || "").trim();
    if (candidate && candidate === lvl.flag) {
      printText("✓ 正確！flag 已驗證：" + candidate, "");
      onLevelCleared();
    } else {
      printText("✗ 不對喔，再檢查看看！", "c-err");
      GAME.wrongFlagPenalty += 10;
      PROGRESS.score -= 10; renderScore();
      loseHeart();
    }
  }

  function spawnConfetti() {
    var layer = $("confetti-layer");
    var colors = ["#ff9ebb", "#ffd447", "#7dffa8", "#c3a6ea"];
    for (var i = 0; i < 44; i++) {
      var p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.left = (Math.random() * 96) + "%";
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random() * 0.25) + "s";
      p.style.animationDuration = (1 + Math.random() * 0.5) + "s";
      layer.appendChild(p);
      (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2200); })(p);
    }
  }
  var clearBannerEl = null;
  function showClearBanner() {
    clearBannerEl = document.createElement("div");
    clearBannerEl.className = "clear-banner";
    clearBannerEl.textContent = "關卡完成！\nLEVEL CLEAR!";
    document.body.appendChild(clearBannerEl);
  }
  function hideClearBanner() {
    if (clearBannerEl && clearBannerEl.parentNode) clearBannerEl.parentNode.removeChild(clearBannerEl);
    clearBannerEl = null;
  }

  var KITTEN_INTRO = [
    "喵～我是喵哥！先打 pwd 看看你在哪，再用 ls 四處看看吧 🐾",
    "日誌塔好多 log 喵…一行一行看會看到天亮，grep 是你的好朋友！",
    "書庫像迷宮一樣深！別一層層 cd，讓 find 幫你找喵。",
    "這扇門有權限鎖喵。ls -l 看清楚 rwx 再動手！",
    "影子鼠就躲在王座之間！用管線 | 把指令串起來抓牠 🐾"
  ];
  var KITTEN_CHEER = [
    "喵嗚～WEB-SRV 自由了！你的第一個 flag 🎉",
    "LOG-SRV 得救！grep 大師就是你喵～",
    "FILE-SRV 出籠！find 找東西比我找罐罐還快！",
    "DB-SRV 解鎖！權限的祕密被你看穿了喵！",
    "ROOT-SRV 回來了！影子鼠被趕跑啦 👑"
  ];
  function popPadlock(wrap) {
    var r = wrap.getBoundingClientRect();
    var lk = makeIcon("padlock", "padlock-pop");
    lk.style.left = (r.left + r.width / 2 - 12) + "px";
    lk.style.top = (r.top + r.height - 34) + "px";
    document.body.appendChild(lk);
    setTimeout(function () { if (lk.parentNode) lk.parentNode.removeChild(lk); }, 900);
  }
  function playClearAnimation(idx, cb) {
    var wrap = $("cage-wrap-" + idx);
    var lvl = LCQ.LEVELS[idx];
    function swapToHappy() {
      wrap.textContent = "";
      wrap.appendChild(makeIcon("cage_open", "sprite-open"));
      wrap.appendChild(makeIcon("srv_" + lvl.key + "_happy", "sprite-happy anim-hop"));
    }
    if (GAME.reducedMotion) {
      swapToHappy();
      kittenSay(KITTEN_CHEER[idx] || "喵嗚～救出來了！", { happy: true });
      setTimeout(cb, 150);
      return;
    }
    wrap.classList.add("anim-shake");
    setTimeout(function () {
      wrap.classList.remove("anim-shake");
      popPadlock(wrap);
      swapToHappy();
      kittenSay(KITTEN_CHEER[idx] || "喵嗚～救出來了！", { happy: true });
      spawnConfetti();
      setTimeout(function () {
        showClearBanner();
        setTimeout(function () { hideClearBanner(); cb(); }, 900);
      }, 1000);
    }, 800);
  }

  function showPostClearModal(lvl, levelScore) {
    $("postclear-title").textContent = "關卡完成！LEVEL CLEAR！（+" + levelScore + " 分）";
    $("postclear-redteam").textContent = lvl.postClear.redteam;
    $("postclear-defense").textContent = lvl.postClear.defense;
    $("postclear-commands").textContent = lvl.postClear.commandsLearned.join("、");
    var btn = $("postclear-continue-btn");
    var isLast = GAME.levelIndex === LCQ.LEVELS.length - 1;
    btn.textContent = isLast ? "查看成績 ▶（Enter）" : "下一關 ▶（Enter）";
    btn.onclick = function () {
      hideModal("postclear-modal");
      if (isLast) runFinalTeaseThenEnding();
      else loadLevel(GAME.levelIndex + 1);
    };
    showModal("postclear-modal");
  }

  function onLevelCleared() {
    input.disabled = true;
    var idx = GAME.levelIndex;
    var lvl = LCQ.LEVELS[idx];
    var elapsedSec = (Date.now() - GAME.startTime) / 1000;
    var timeBonus = Math.max(0, 50 - Math.floor(elapsedSec / 2));
    var levelScore = Math.max(0, 100 + timeBonus - GAME.hintPenalty - GAME.wrongFlagPenalty);

    PROGRESS.cleared[idx] = true;
    PROGRESS.badges[idx] = true;
    PROGRESS.score += levelScore;
    PROGRESS.hintsUsed[idx] = GAME.hintsUsedThisLevel;
    var prevBest = PROGRESS.bestTimes[idx];
    PROGRESS.bestTimes[idx] = (prevBest == null) ? elapsedSec : Math.min(prevBest, elapsedSec);
    if (PROGRESS.currentLevel === idx + 1) PROGRESS.currentLevel = Math.min(5, idx + 2);
    saveProgress();
    renderScore(); renderBadgesRow();

    playClearAnimation(idx, function () { showPostClearModal(lvl, levelScore); });
  }

  function runFinalTeaseThenEnding() {
    var lvl = LCQ.LEVELS[4];
    var tease = lvl.finalTease;
    printLine(commandEchoLine(tease.command));
    var result = LCQ.execPipeline(tease.command, GAME.vfs, GAME.gameCtx);
    (result.out || []).forEach(function (item) { printLine(renderOutItem(item)); });
    kittenSay(tease.kittenLine, { happy: true });
    setTimeout(showEndingModal, GAME.reducedMotion ? 400 : 2200);
  }

  function showEndingModal() {
    var serversEl = $("ending-servers"); serversEl.textContent = "";
    LCQ.LEVELS.forEach(function (lvl) { serversEl.appendChild(makeIcon("srv_" + lvl.key + "_happy")); });
    var totalTime = PROGRESS.bestTimes.reduce(function (a, b) { return a + (b || 0); }, 0);
    $("ending-summary").textContent =
      "總分：" + Math.max(0, PROGRESS.score) + " / " + SCORE_MAX + "\n" +
      "總耗時：" + Math.round(totalTime) + " 秒\n" +
      "使用提示次數：" + PROGRESS.hintsUsed.reduce(function (a, b) { return a + b; }, 0) + " 次\n" +
      "雲端城堡的五台伺服器都平安回家了！🎉";
    var badgesEl = $("ending-badges"); badgesEl.textContent = "";
    LCQ.LEVELS.forEach(function (lvl, i) {
      badgesEl.appendChild(makeIcon(PROGRESS.badges[i] ? "badge_" + lvl.badge : "badge_locked"));
    });
    showModal("ending-modal");
  }

  /* ---------- level select modal ---------- */
  function openLevelSelect() {
    var list = $("levelselect-list"); list.textContent = "";
    LCQ.LEVELS.forEach(function (lvl, i) {
      var unlocked = i <= (PROGRESS.currentLevel - 1) || PROGRESS.cleared[i];
      var item = document.createElement("div");
      item.className = "ls-item" + (unlocked ? "" : " locked");
      item.appendChild(makeIcon(PROGRESS.cleared[i] ? "srv_" + lvl.key + "_happy" : "srv_" + lvl.key + "_caged"));
      var name = document.createElement("div");
      name.className = "ls-name"; name.textContent = "LEVEL " + (i + 1) + " / " + lvl.nameZh + "（" + lvl.serverLabel + "）";
      item.appendChild(name);
      var status = document.createElement("div");
      status.className = "ls-status";
      status.textContent = PROGRESS.cleared[i] ? "✓ 已救出" : (unlocked ? "可挑戰" : "🔒 未解鎖");
      item.appendChild(status);
      if (unlocked) {
        item.addEventListener("click", function () { hideModal("levelselect-modal"); loadLevel(i); });
      }
      list.appendChild(item);
    });
    showModal("levelselect-modal");
  }

  /* ---------- level loading ---------- */
  function printWelcome(lvl) {
    printText("連線到 " + lvl.serverLabel + " 子系統……", "c-dim");
    printText("輸入 help 查看可用指令，hint 或按 💡 取得提示。", "c-dim");
  }
  function showStoryModal(lvl) {
    $("story-title").textContent = "LEVEL " + (GAME.levelIndex + 1) + " ／ " + lvl.nameZh + "（" + lvl.serverLabel + "）";
    $("story-body").textContent = lvl.story;
    $("story-objective").textContent = "★ 目標：" + lvl.objective;
    $("story-continue-btn").onclick = function () {
      hideModal("story-modal");
      input.disabled = false;
      input.focus();
      kittenSay(KITTEN_INTRO[GAME.levelIndex] || "喵～準備好了就開始吧！");
    };
    showModal("story-modal");
  }

  function loadLevel(idx, opts) {
    opts = opts || {};
    GAME.levelIndex = idx;
    var lvl = LCQ.LEVELS[idx];
    var root = lvl.buildFs();
    GAME.vfs = new LCQ.VFS(root);
    GAME.history = [];
    GAME.historyIndex = 0;
    GAME.hearts = 3;
    GAME.hintTier = 0;
    GAME.hintsUsedThisLevel = 0;
    GAME.hintPenalty = 0;
    GAME.wrongFlagPenalty = 0;
    GAME.startTime = Date.now();
    GAME.gameCtx = { history: GAME.history, processTable: lvl.processTable };

    renderLevelLabel(); renderHearts(); renderScore(); renderBadgesRow();
    renderObjective(); renderChips(); renderCagesRow();

    clearTerminal();
    printWelcome(lvl);
    updatePrompt();
    input.value = "";
    input.disabled = true;
    setKittenSprite("idle");
    $("speech-text").textContent = "";

    if (!opts.silent) {
      showStoryModal(lvl);
    } else {
      input.disabled = false;
      input.focus();
    }
  }

  /* ---------- terminal input handling ---------- */
  function submitLine() {
    var line = input.value;
    printLine(commandEchoLine(line));
    input.value = "";
    if (!line.trim()) { updatePrompt(); return; }
    GAME.history.push(line);
    GAME.historyIndex = GAME.history.length;

    var result;
    try {
      result = LCQ.execPipeline(line, GAME.vfs, GAME.gameCtx);
    } catch (e) {
      result = { out: [], err: ["bash: 執行時發生未預期的錯誤"], code: 1 };
    }
    if (result.unknown) { handleUnknown(result.unknown); updatePrompt(); return; }
    if (result.clear) { clearTerminal(); updatePrompt(); return; }
    (result.out || []).forEach(function (item) { printLine(renderOutItem(item)); });
    (result.err || []).forEach(function (e) { printText(e, "c-err"); });
    if (result.special === "hint") showHint();
    if (result.special === "submit") handleSubmit(result.submitArg);
    updatePrompt();
  }

  function handleTab() {
    var val = input.value;
    var wordStart = val.lastIndexOf(" ") + 1;
    var word = val.slice(wordStart);
    var isFirst = val.slice(0, wordStart).trim() === "";
    var cands = LCQ.completeWord(GAME.vfs, word, isFirst);
    if (cands.length === 1) {
      input.value = val.slice(0, wordStart) + cands[0] + (isFirst ? " " : "");
    } else if (cands.length > 1) {
      printLine(commandEchoLine(val));
      printText(cands.join("  "), "c-dim");
    }
  }
  function handleCtrlC() {
    var line = document.createElement("div");
    line.className = "term-line";
    line.appendChild(span(promptString() + " ", "c-prompt"));
    line.appendChild(span(input.value, ""));
    line.appendChild(span("^C", "c-err"));
    printLine(line);
    input.value = "";
  }
  function historyUp() {
    if (!GAME.history.length) return;
    if (GAME.historyIndex > 0) GAME.historyIndex--;
    input.value = GAME.history[GAME.historyIndex] || "";
  }
  function historyDown() {
    if (!GAME.history.length) return;
    if (GAME.historyIndex < GAME.history.length - 1) {
      GAME.historyIndex++;
      input.value = GAME.history[GAME.historyIndex] || "";
    } else {
      GAME.historyIndex = GAME.history.length;
      input.value = "";
    }
  }

  /* ---------- bootstrap ---------- */
  function wireStaticUI() {
    input = $("term-input");
    termOutput = $("term-output");
    promptEl = $("prompt-text");
    terminalWrap = $("terminal-wrap");

    document.documentElement.style.setProperty("--bg-sky-url", 'url("' + SPRITES.bg_sky + '")');
    document.querySelectorAll(".icon-crown").forEach(function (img) { img.src = SPRITES.crown; });
    document.querySelectorAll(".icon-star").forEach(function (img) { img.src = SPRITES.star; });
    $("castle-sprite").src = SPRITES.castle;
    $("mug-sprite").src = SPRITES.mug;

    terminalWrap.addEventListener("click", function () { if (!input.disabled) input.focus(); });

    input.addEventListener("keydown", function (e) {
      if (e.key === "Tab") { e.preventDefault(); handleTab(); return; }
      if (e.ctrlKey && (e.key === "l" || e.key === "L")) { e.preventDefault(); clearTerminal(); return; }
      if (e.ctrlKey && (e.key === "c" || e.key === "C")) { e.preventDefault(); handleCtrlC(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); historyUp(); return; }
      if (e.key === "ArrowDown") { e.preventDefault(); historyDown(); return; }
      if (e.key === "Enter") { e.preventDefault(); submitLine(); return; }
    });

    $("hint-btn").addEventListener("click", function () { if (!input.disabled) showHint(); });
    $("level-select-btn").addEventListener("click", openLevelSelect);
    $("levelselect-close-btn").addEventListener("click", function () { hideModal("levelselect-modal"); });
    $("reset-progress-btn").addEventListener("click", function () {
      if (window.confirm("確定要重設所有進度嗎？這個動作無法復原。")) {
        resetProgress();
        hideModal("levelselect-modal");
        loadLevel(0);
      }
    });
    $("ending-close-btn").addEventListener("click", function () {
      hideModal("ending-modal");
      openLevelSelect();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      for (var id in MODALS) {
        var el = $(id);
        if (!el.hidden) {
          if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
          e.preventDefault();
          $(MODALS[id].continueBtn).click();
          return;
        }
      }
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    PROGRESS = loadProgress();
    GAME.reducedMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    wireStaticUI();
    var startIdx = Math.min(LCQ.LEVELS.length - 1, Math.max(0, PROGRESS.currentLevel - 1));
    loadLevel(startIdx);
  });
})();
</script>
</body>
</html>
